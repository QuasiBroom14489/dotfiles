# AeroSpace — i3-style tiling for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ── JankyBorders + SketchyBar integration ──
after-startup-command = [
  'exec-and-forget borders active_color=0xff7aa2f7 inactive_color=0xff565f89 width=6.0',
  'exec-and-forget sketchybar --trigger aerospace_workspace_change',
]
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# ── Gaps ──
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 40   # room for SketchyBar
outer.right      = 8

# ═══════════════════════════════════════════════════════════════════════
# Main mode — the default.
#
# Hyper (Right Cmd) = ⌘⌥⌃. Shift is deliberately NOT part of Hyper, so
# `Hyper + Shift + key` is a distinct second layer. The convention is the
# i3 one: Hyper acts on focus, Hyper+Shift acts on the window itself.
# ═══════════════════════════════════════════════════════════════════════
[mode.main.binding]

# Focus (Hyper + h/j/k/l)
alt-cmd-ctrl-h = 'focus left'
alt-cmd-ctrl-j = 'focus down'
alt-cmd-ctrl-k = 'focus up'
alt-cmd-ctrl-l = 'focus right'

# Move the focused window (Hyper + Shift + h/j/k/l)
alt-shift-cmd-ctrl-h = 'move left'
alt-shift-cmd-ctrl-j = 'move down'
alt-shift-cmd-ctrl-k = 'move up'
alt-shift-cmd-ctrl-l = 'move right'

# Resize (Hyper + -/=)
alt-cmd-ctrl-minus = 'resize smart -50'
alt-cmd-ctrl-equal = 'resize smart +50'

# Layout
alt-cmd-ctrl-slash = 'layout tiles horizontal vertical'
alt-cmd-ctrl-comma = 'layout accordion horizontal vertical'
alt-cmd-ctrl-f     = 'fullscreen'
alt-cmd-ctrl-space = 'layout floating tiling'

# Switch workspace (Hyper + 1..9)
alt-cmd-ctrl-1 = 'workspace 1'
alt-cmd-ctrl-2 = 'workspace 2'
alt-cmd-ctrl-3 = 'workspace 3'
alt-cmd-ctrl-4 = 'workspace 4'
alt-cmd-ctrl-5 = 'workspace 5'
alt-cmd-ctrl-6 = 'workspace 6'
alt-cmd-ctrl-7 = 'workspace 7'
alt-cmd-ctrl-8 = 'workspace 8'
alt-cmd-ctrl-9 = 'workspace 9'

# Send the focused window to a workspace (Hyper + Shift + 1..9)
alt-shift-cmd-ctrl-1 = 'move-node-to-workspace 1'
alt-shift-cmd-ctrl-2 = 'move-node-to-workspace 2'
alt-shift-cmd-ctrl-3 = 'move-node-to-workspace 3'
alt-shift-cmd-ctrl-4 = 'move-node-to-workspace 4'
alt-shift-cmd-ctrl-5 = 'move-node-to-workspace 5'
alt-shift-cmd-ctrl-6 = 'move-node-to-workspace 6'
alt-shift-cmd-ctrl-7 = 'move-node-to-workspace 7'
alt-shift-cmd-ctrl-8 = 'move-node-to-workspace 8'
alt-shift-cmd-ctrl-9 = 'move-node-to-workspace 9'

# Enter move-window mode: Hyper + m
# Retained as a modal alternative to the Hyper+Shift layer above.
alt-cmd-ctrl-m = 'mode move'

# Hyper + Enter (new Ghostty window) is bound in Hammerspoon instead.
# `open -na Ghostty` launched a new app *instance* per press — one extra
# process and Dock icon each time. Hammerspoon selects File → New Window on
# the running instance. See init.lua.

# Reload config: Hyper + r  (Hyper+Shift+r reloads Hammerspoon)
alt-cmd-ctrl-r = 'reload-config'

# ═══════════════════════════════════════════════════════════════════════
# Move mode — after Hyper+m. Plain h/j/k/l moves the window, 1..9 sends
# it to a workspace, Esc returns to main mode.
# ═══════════════════════════════════════════════════════════════════════
[mode.move.binding]

# Move within tree
h = ['move left',  'mode main']
j = ['move down',  'mode main']
k = ['move up',    'mode main']
l = ['move right', 'mode main']

# Send window to workspace
1 = ['move-node-to-workspace 1', 'mode main']
2 = ['move-node-to-workspace 2', 'mode main']
3 = ['move-node-to-workspace 3', 'mode main']
4 = ['move-node-to-workspace 4', 'mode main']
5 = ['move-node-to-workspace 5', 'mode main']
6 = ['move-node-to-workspace 6', 'mode main']
7 = ['move-node-to-workspace 7', 'mode main']
8 = ['move-node-to-workspace 8', 'mode main']
9 = ['move-node-to-workspace 9', 'mode main']

# Escape hatches
esc   = 'mode main'
enter = 'mode main'

# ═══════════════════════════════════════════════════════════════════════
# Auto-assign apps to workspaces on window creation
# 1=terminal 2=browser 3=obsidian 4=code 5=scratch 6=chat 7=music 8=pip 9=calls
# ═══════════════════════════════════════════════════════════════════════

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 7']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['move-node-to-workspace 9', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace 9', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.FaceTime'
run = ['move-node-to-workspace 9', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']
