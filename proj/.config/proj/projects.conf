# ~/.config/proj/projects.conf — what `proj` (Hyper+J launcher, desktop shelf) lists.
#
# One directive per line:  <directive> <value>...   (# starts a comment, ~ expands)
#
#   scan   <glob>...   every match that is a git repo becomes a project
#   course <glob>...   every matching DIRECTORY is a course project (git not required)
#   add    <path>...   one project, git or not
#   hide   <slug>...   discovered, but not listed (still reachable by `proj attach`)
#   never  <path>...   never listed, never scanned into, never touched
#
# Slugs are the lowercased folder name ("DataStructures" → datastructures) and
# double as the Zellij session name. Keep them lowercase: APFS is case-insensitive,
# so "dataStructures" and "datastructures" share one session cache directory.

scan    ~/* ~/Projects/* ~/Projects/*/* ~/0npace/main
course  ~/School/ND2026-2027/* ~/CompOrg

hide    powerlevel10k goal-system

# Data Club / South Shore: hands-off by agreement — never read, never listed.
never   ~/DataClub
